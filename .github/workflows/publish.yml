name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with OIDC trusted publishing support
        run: npm install --global "npm@^11.5.1"
      - name: Install locked dependencies
        run: npm ci
      - name: Validate release versions
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          server_version="$(node -p "require('./server.json').version")"
          expected_tag="v${package_version}"
          test "${server_version}" = "${package_version}"
          test "${GITHUB_REF_NAME}" = "${expected_tag}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish package with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
